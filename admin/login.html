<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin · Hidayatul Ma'mun</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
  <main class="auth-wrap">
    <a class="back-link" href="../index.html">← Kembali ke website</a>
    <section class="auth-card">
      <img class="auth-logo" src="../assets/logo-placeholder.svg" alt="Logo pondok">
      <p class="section-kicker">Area Terbatas</p><h1>Login Administrator</h1>
      <p class="muted">Masuk menggunakan akun admin yang dibuat oleh pengelola sistem.</p>
      <form id="loginForm">
        <label for="email">Email admin</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">Kata sandi</label><input id="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary full" type="submit">Masuk</button>
        <p class="form-message" id="loginMessage" role="status"></p>
      </form>
      <p class="tiny-note">Pendaftaran admin publik dinonaktifkan. Akun dibuat melalui Supabase oleh pemilik proyek.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
